[workspace]
resolver = "3"
members = ["crates/kwoon", "crates/kwoon-run"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
kwoon-run = { path = "crates/kwoon-run" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
