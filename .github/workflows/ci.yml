name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # The wrapper tests need unprivileged user and PID namespaces. A denied namespace
    # fails the tests; it is never skipped (plan T1). GitHub's ubuntu-24.04 runner denies
    # them (kernel.apparmor_restrict_unprivileged_userns = 1; bubblewrap reports
    # "loopback: Failed RTM_NEWADDR: Operation not permitted"), so this job runs on
    # ubuntu-22.04, which allows them.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
      - name: Show the namespace settings of this runner
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces || true
          bwrap --unshare-all --unshare-user --unshare-pid --ro-bind / / true
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Static musl build
        run: |
          cargo build --release --locked
          file target/x86_64-unknown-linux-musl/release/kwoon
          file target/x86_64-unknown-linux-musl/release/kwoon | grep -q 'static-pie linked'
